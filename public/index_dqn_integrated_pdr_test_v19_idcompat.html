<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>地下街室內導航系統｜REAL PDR TEST v19 ID COMPAT</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f6f9;
        --panel: #ffffff;
        --line: #e2e8f0;
        --text: #1e293b;
        --muted: #64748b;
        --accent: #0f766e;
        --blue: #3b82f6;
        --blue-hover: #2563eb;
        --danger: #ef4444;
        --route: #146c63;
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        letter-spacing: 0.3px;
        -webkit-font-smoothing: antialiased;
      }
      button, input, select, textarea {
        font: inherit;
        color: inherit;
      }
      
      .app {
        min-height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      
      .topbar {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        padding: calc(16px + env(safe-area-inset-top)) 16px 16px;
        background: var(--panel);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        border-radius: 0 0 20px 20px;
        position: relative;
        z-index: 10;
      }
      .brand {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 0.5px;
      }
      .brand span {
        background: #e0f2fe;
        color: #0369a1;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
      }
      .search {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }
      
      input, select, textarea {
        width: 100%;
        min-height: 44px;
        border: 2px solid transparent;
        background: #f1f5f9;
        border-radius: 12px;
        padding: 0 16px;
        outline: none;
        transition: all 0.25s ease;
      }
      input:focus, select:focus, textarea:focus {
        background: #fff;
        border-color: var(--blue);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
      }
      button {
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        padding: 0 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      button:hover {
        background: #f8fafc;
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(1px);
      }
      
      .primary {
        border: none;
        background: linear-gradient(135deg, var(--blue), var(--blue-hover));
        color: #fff;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      }
      .primary:hover {
        background: linear-gradient(135deg, #4f8cf6, #1d4ed8);
        box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        color: #fff;
      }
      
      .map-shell {
        position: relative;
        min-height: 460px;
        overflow: hidden;
        background: #e2e8f0;
      }
      .map-shell.navigation-start canvas { animation: mapStartPulse 0.9s ease-out; }
      .map-shell.navigation-end canvas { animation: mapEndFade 0.65s ease-out; }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      
      .floor-switch, .map-tools, .status-chip {
        position: absolute;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        border-radius: 14px;
      }
      .status-chip {
        left: 16px;
        right: 16px;
        top: 16px;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 16px;
        color: var(--text);
        font-weight: 500;
        font-size: 14px;
      }
      #dataStatus { color: var(--muted); font-size: 13px; }
      
      .floor-switch { left: 16px; top: 80px; display: grid; gap: 4px; padding: 6px; }
      .map-tools { right: 16px; top: 80px; display: grid; gap: 4px; padding: 6px; }
      
      .floor-switch button, .map-tools button {
        width: 44px;
        height: 44px;
        padding: 0;
        border: none;
        background: transparent;
        border-radius: 10px;
        color: var(--text);
      }
      .floor-switch button:hover, .map-tools button:hover { background: rgba(0, 0, 0, 0.05); }
      .floor-switch button.active, .map-tools button.active {
        background: var(--blue);
        color: #fff;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
      }
      
      .nav-flash {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        opacity: 0;
        pointer-events: none;
        padding: 16px 24px;
        border-radius: 50px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        color: #fff;
        font-size: 18px;
        font-weight: 600;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      .nav-flash.show { animation: flashInOut 1.25s ease both; }
      
      .sheet {
        background: var(--panel);
        box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.06);
        border-radius: 24px 24px 0 0;
        padding: 24px 16px calc(16px + env(safe-area-inset-bottom));
        position: relative;
        z-index: 10;
      }
      .sheet::before {
        content: '';
        display: block;
        width: 40px;
        height: 5px;
        background: #cbd5e1;
        border-radius: 10px;
        margin: -10px auto 16px;
      }
      
      .next-step { margin: 0 0 12px; font-size: 18px; font-weight: 700; color: var(--text); }
      .meta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 14px;
        margin-bottom: 16px;
        font-weight: 500;
      }
      .meta span {
        background: #f1f5f9;
        padding: 6px 12px;
        border-radius: 8px;
        color: var(--muted);
      }
      #destinationText { color: var(--blue); background: #eff6ff; }
      
      .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      
      .results {
        max-height: 220px;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        margin-top: 16px;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      }
      .result {
        padding: 14px 16px;
        border-bottom: 1px solid #f1f5f9;
        transition: background 0.2s ease;
      }
      .result:last-child { border-bottom: none; }
      .result:hover { background: #f8fafc; }
      .result strong { font-size: 16px; color: var(--text); }
      .result span { display: inline-block; margin-top: 4px; }
      
      .result button.primary {
        background: #fff;
        color: var(--blue);
        border: 1px solid var(--blue);
        box-shadow: none;
      }
      .result button.primary:hover {
        background: var(--blue);
        color: #fff;
      }
      
      .privacy {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-top: 16px;
        padding: 12px;
        background: #f8fafc;
        border-radius: 12px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .privacy input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--blue); }
      
      dialog {
        border: none;
        border-radius: 20px;
        padding: 24px;
        width: min(420px, calc(100vw - 32px));
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        color: var(--text);
      }
      dialog::backdrop {
        background: rgba(15, 23, 42, 0.5);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      dialog h2 { margin: 0 0 16px 0; font-size: 20px; color: var(--text); }
      .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
      
      @media (min-width: 900px) {
        .app { width: min(1180px, 100%); margin: 0 auto; box-shadow: 0 0 40px rgba(0,0,0,0.05); }
        .topbar {
          grid-template-columns: minmax(360px, 1fr) minmax(260px, auto);
          border-radius: 0;
        }
        .map-shell { min-height: 680px; }
        .sheet {
          border-left: 1px solid var(--line);
          border-right: 1px solid var(--line);
          border-radius: 24px 24px 0 0;
        }
        .sheet::before { display: none; }
      }
      
      @keyframes flashInOut {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
        15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        25% { transform: translate(-50%, -50%) scale(1); }
        85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
      }
      @keyframes mapStartPulse {
        0% { filter: saturate(1); }
        40% { filter: saturate(1.2) contrast(1.05); }
        100% { filter: saturate(1); }
      }
      @keyframes mapEndFade {
        0% { opacity: 1; }
        35% { opacity: 0.6; }
        100% { opacity: 1; }
      }

      .brand-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .lang-switch {
        display: inline-flex;
        gap: 2px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f8fafc;
      }
      .lang-switch button {
        min-height: 30px;
        padding: 0 9px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        font-size: 12px;
        box-shadow: none;
      }
      .lang-switch button.active {
        background: var(--blue);
        color: #fff;
      }
      .lang-switch button:hover { transform: none; }
    
      #sosButton {
        position: fixed;
        right: 18px;
        bottom: calc(112px + env(safe-area-inset-bottom));
        width: 82px;
        height: 82px;
        min-height: 82px;
        padding: 0;
        border: 4px solid #fff;
        border-radius: 50%;
        background: #dc2626;
        color: #fff;
        font-size: 21px;
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: 1px;
        box-shadow: 0 8px 24px rgba(220, 38, 38, 0.52);
        z-index: 9999;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      #sosButton small {
        display: block;
        margin-top: 5px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0;
      }

      #sosButton.sos-holding {
        animation: sosHoldPulse 0.34s ease-in-out infinite alternate;
        background: #b91c1c;
      }

      #sosOverlay {
        position: fixed;
        inset: 0;
        display: none;
        z-index: 10000;
        padding:
          calc(34px + env(safe-area-inset-top))
          24px
          calc(34px + env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at center, rgba(239,68,68,.96), rgba(127,29,29,.99));
        color: #fff;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        animation: sosScreenPulse 0.82s ease-in-out infinite alternate;
      }

      #sosOverlay.sos-active {
        display: flex;
      }

      #sosOverlay .sos-symbol {
        font-size: clamp(64px, 18vw, 120px);
        line-height: 1;
        margin-bottom: 18px;
      }

      #sosOverlay h2 {
        margin: 0 0 12px;
        font-size: clamp(28px, 8vw, 48px);
        color: #fff;
      }

      #sosOverlay p {
        margin: 0 0 28px;
        max-width: 560px;
        font-size: clamp(16px, 4vw, 22px);
        font-weight: 700;
        line-height: 1.45;
      }

      #sosStopButton {
        min-width: min(360px, 86vw);
        min-height: 76px;
        border: 4px solid #fff;
        border-radius: 22px;
        background: #fff;
        color: #991b1b;
        font-size: 24px;
        font-weight: 900;
        box-shadow: 0 12px 30px rgba(0,0,0,.28);
      }

      @keyframes sosHoldPulse {
        from { transform: scale(1); }
        to { transform: scale(1.10); }
      }

      @keyframes sosScreenPulse {
        from { filter: brightness(.88); }
        to { filter: brightness(1.12); }
      }

    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <h1 id="appTitle">地下街室內導航系統</h1>
          <div class="brand-actions">
            <span id="clientBadge">用戶端</span>
            <div class="lang-switch" role="group" aria-label="Language">
              <button id="langZhButton" type="button">中文</button>
              <button id="langEnButton" type="button">EN</button>
            </div>
          </div>
        </div>
        <div class="search">
          <input
            id="searchInput"
            type="search"
            placeholder="輸入地點、設施或分類"
          /><button id="searchButton" class="primary">搜尋</button>
        </div>
        <select id="mapSelect" aria-label="選擇地圖"></select>
      </header>

      <main class="map-shell">
        <canvas id="mapCanvas"></canvas>
        <div class="status-chip">
          <span id="floorLabel">樓層</span
          ><span id="dataStatus">讀取資料中</span>
        </div>
        <div id="realDebug" aria-hidden="true" style="display:none !important;
          position:absolute;
          left:50%;
          top:76px;
          transform:translateX(-50%);
          z-index:30;
          display:none;
          padding:7px 10px;
          border-radius:10px;
          background:rgba(17,24,39,.88);
          color:#fff;
          font:600 12px/1.35 Microsoft JhengHei, sans-serif;
          pointer-events:none;
          box-shadow:0 4px 14px rgba(0,0,0,.18);
          white-space:nowrap;
        ">REAL DEBUG</div>
        <div id="navFlash" class="nav-flash">開始導航</div>
        <div id="floorButtons" class="floor-switch"></div>
        <div class="map-tools">
          <button id="relocateButton">跟隨</button>
          <button id="pointModeButton">顯示</button>
          <button id="zoomInButton">+</button>
          <button id="zoomOutButton">-</button>
          <button id="resetButton">2D</button>
          <button id="gridOverlayButton">網格</button>
        </div>
      </main>

      <section class="sheet">
        <p id="nextStep" class="next-step">
          請搜尋目的地，或從結果中選擇地點。
        </p>
        <div class="meta">
          <span id="destinationText">目的地：尚未選擇</span
          ><span id="distanceText">距離：-- 公尺</span
          ><span id="timeText">時間：-- 分鐘</span
          ><span id="headingText" hidden></span>
        </div>
        <div class="actions">
          <button id="showRouteButton">顯示路線</button
          ><button id="startButton" class="primary">開始導航</button
          ><button id="endButton">結束導航</button>
        </div>
        <div id="results" class="results" hidden></div>
        <label class="privacy"
          ><span id="privacyHint"
            >協助改善定位：匿名上傳必要定位狀態，不包含姓名或個人身分資料。</span
          ><input id="feedbackSwitch" type="checkbox"
        /></label>
      </section>
    </div>

    <dialog id="privacyDialog">
      <h2 id="privacyTitle">定位資料說明</h2>
      <p id="privacyBody">
        系統可在取得同意後，匿名上傳導航過程中的 Wi-Fi
        訊號與定位狀態，用於改善定位準確度，不包含姓名、電話或個人身分資料。
      </p>
      <div class="dialog-actions">
        <button id="declinePrivacy">不同意</button
        ><button id="acceptPrivacy" class="primary">同意</button>
      </div>
    </dialog>

    <dialog id="reviewDialog" style="max-width: 500px; width: 90%;">
      <h2 id="reviewPlaceName" style="margin-top: 0;">商店名稱</h2>
      
      <div id="reviewsContainer" style="max-height: 250px; overflow-y: auto; background: #f9fafb; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
        <div style="text-align: center; color: var(--muted);">載入評論中...</div>
      </div>

      <div style="border-top: 1px solid var(--line); padding-top: 15px;">
        <label id="reviewStarLabel" style="display: block; font-weight: bold; margin-bottom: 5px;">給予星級：</label>
        <select id="reviewStar" style="margin-bottom: 10px; padding: 8px;">
          <option value="5">⭐⭐⭐⭐⭐ (5星 - 超讚)</option>
          <option value="4">⭐⭐⭐⭐ (4星 - 很好)</option>
          <option value="3">⭐⭐⭐ (3星 - 普通)</option>
          <option value="2">⭐⭐ (2星 - 待加強)</option>
          <option value="1">⭐ (1星 - 極差)</option>
        </select>
        
        <label id="reviewTextLabel" style="display: block; font-weight: bold; margin-bottom: 5px;">你的評論：</label>
        <textarea id="reviewText" placeholder="寫下你的體驗與評價..." style="width: 100%; height: 80px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; resize: vertical; outline: none;"></textarea>
      </div>

      <div class="dialog-actions" style="margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end;">
        <button id="closeReviewButton" onclick="document.getElementById('reviewDialog').close()">關閉</button>
        <button id="submitReviewButton" onclick="submitReview()" class="primary">送出評價</button>
      </div>
    </dialog>

              30: 317, 31: 340, 32: 343, 33: 355, 34: 370

          if (xMap[gridX] !== undefined) return xMap[gridX];
          const keys = Object.keys(xMap).map(Number).sort((a,b)=>a-b);
          for(let i=0; i<keys.length-1; i++){
              if(gridX > keys[i] && gridX < keys[i+1]){
                  const p = (gridX - keys[i]) / (keys[i+1] - keys[i]);
                  return xMap[keys[i]] + p * (xMap[keys[i+1]] - xMap[keys[i]]);
              }
          }
          return gridX * 10;
      }

      function performSearch() {
        const keyword = searchInput.value.trim().toLowerCase();
        
        let matched = keyword
          ? navigationTargets()
          : navigationTargets().filter(
              (place) => place.floorId === state.currentFloorId
            );

        if (keyword) {
          matched = matched.filter((place) =>
            [place.id, place.name, place.category, categoryText(place.category), place.description].some(
              (value) => String(value || "").toLowerCase().includes(keyword)
            )
          );
          
          const exact = matched.find(
            (place) => String(place.id).toLowerCase() === keyword || String(place.name).toLowerCase() === keyword
          );
          if (exact) selectDestination(exact.id);
          
        } else {
          matched = matched.filter(
            (place) =>
              place.source !== "wifiPoint" &&
              place.category !== "設施" &&
              place.category !== "廣場" &&
              place.category !== "出口"
          );
        }

        results.hidden = matched.length === 0;

        results.innerHTML = matched
          .map(
            (place) => `

          if (state.destination.floorId !== state.current.floorId) {
            nextStep.textContent =
              t("transferFloor", { floor: uiFloorName(state.destination.floorId) });
          } else {
            nextStep.textContent = t("destinationSet", { name: state.destination.name });
          }

        showRoute();
        renderAll();

      async function showRoute() {
        if (!state.destination) {
          nextStep.textContent = t("chooseDestination");
          return;
        }

        if (!state.hasRealLocation) {
          state.route = [];
          nextStep.textContent = t("needReal");
          renderAll();
          return;
        }

        try {
          if (
            state.current.floorId === FLOOR2_ID &&
            state.destination.floorId === FLOOR2_ID
          ) {
            const floor2AnchorOrder = [
              "ESCALATOR_END",
              "MRT_P25",
              "MRT_P50",
              "MRT_P75",
              "END_MRT",
            ];

            let startIndex = floor2AnchorOrder.indexOf(
              String(state.current.anchorId || "")
            );

            const targetIndex = floor2AnchorOrder.indexOf(
              String(state.destination.id || "")
            );

            if (startIndex < 0) startIndex = 0;

            const endIndex =
              targetIndex >= 0
                ? targetIndex
                : floor2AnchorOrder.length - 1;

            const step = startIndex <= endIndex ? 1 : -1;
            const routeAnchorIds = [];

            for (let i = startIndex; ; i += step) {
              routeAnchorIds.push(floor2AnchorOrder[i]);
              if (i === endIndex) break;
            }

            state.currentFloorId = FLOOR2_ID;

            state.route = routeAnchorIds.map((anchorId) => {
              const p = FLOOR2_ANCHOR_PIXELS[anchorId];

              return {
                x: Number(p.x),
                y: Number(p.y),
                floorId: FLOOR2_ID,
                anchorId,
              };
            });

            state.routeDistance = 0;
            state.routeTime = 0;

            distanceText.textContent = t("distanceNone");
            timeText.textContent = t("timeNone");
            nextStep.textContent =
              t("proceed", { name: state.destination.name });

            renderFloorButtons();
            updateWorldFromData();

            if (state.viewFollow) centerOnCurrent();

            renderAll();
            return;
          }
          if (
            state.current.floorId === FLOOR2_ID &&
            state.destination.floorId === FLOOR1_ID
          ) {
            const transfer = FLOOR2_ANCHOR_PIXELS.ESCALATOR_END;

            state.currentFloorId = FLOOR2_ID;
            state.route = [
              {
                x: Number(state.current.x),
                y: Number(state.current.y),
                floorId: FLOOR2_ID,
              },
              {
                x: Number(transfer.x),
                y: Number(transfer.y),
                floorId: FLOOR2_ID,
              },
            ];

            state.routeDistance = 0;
            state.routeTime = 0;
            distanceText.textContent = t("distanceNone");
            timeText.textContent = t("timeNone");
            nextStep.textContent =
              t("transferFloor", { floor: uiFloorName(FLOOR1_ID) });

            renderFloorButtons();
            updateWorldFromData();
            if (state.viewFollow) centerOnCurrent();
            renderAll();
            return;
          }

          const isFloor1ToFloor2 =
            state.current.floorId === FLOOR1_ID &&
            state.destination.floorId === FLOOR2_ID;

          if (
            state.destination.floorId !== state.current.floorId &&
            !isFloor1ToFloor2
          ) {
            state.route = [];
            state.routeDistance = 0;
            state.routeTime = 0;
            distanceText.textContent = t("distanceNone");
            timeText.textContent = t("timeNone");
            nextStep.textContent =
              t("transferFloor", { floor: uiFloorName(state.destination.floorId) });
            renderAll();
            return;
          }

          const floor = currentFloor();
          const ox = Number(floor?.imageLeft ?? -4.63);
          const oy = Number(floor?.imageTop ?? -16.36);
          const imgW = Number(floor?.imageWidth ?? 379.06);
          const imgH = Number(floor?.imageHeight ?? 122.73);
          const cols = 75;
          const rows = 25;

          function gridToPixel(gx, gy) {
            return {
              x: ox + (Number(gx) + 0.5) * (imgW / cols),
              y: oy + (Number(gy) + 0.5) * (imgH / rows),
            };
          }

          if (state.current.floorId !== FLOOR1_ID) {
            state.route = [];
            nextStep.textContent = t("proceed", { name: state.destination.name });
            renderAll();
            return;
          }

          const body = {
            mapId: "map_visual_3",
            startFloorId: "k-floor-grid",
            targetFloorId: "k-floor-grid",
            startAnchorId: state.current.anchorId || null,
            startDqnX: Number(state.current.gridX),
            startDqnY: Number(state.current.gridY),
            startX: Number(state.current.x),
            startY: Number(state.current.y),
            destinationPlaceId:
              isFloor1ToFloor2
                ? "K12 樓梯"
                : state.destination.id,
          };

          const response = await fetch(`${API_BASE}/api/routes`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });

          if (!response.ok) {
            const err = await response.json().catch(() => ({}));
            throw new Error(err.detail || `HTTP ${response.status}`);
          }

          const routeData = await response.json();

          state.route = (routeData.path || routeData.routePoints || []).map((coord) => {
            const gx = Number(coord.x);
            const gy = Number(coord.y);
            const p = gridToPixel(gx, gy);
            return {
              x: p.x,
              y: p.y,
              gridX: gx,
              gridY: gy,
              floorId: state.currentFloorId,
            };
          });

          if (state.route.length > 0) {
            state.route.unshift({
              x: state.current.x,
              y: state.current.y,
              gridX: Number(state.current.gridX),
              gridY: Number(state.current.gridY),
              floorId: state.currentFloorId,
            });
          }

          state.routeDistance = Number(routeData.distance || routeData.distance_m || 0);
          state.routeTime = Math.max(1, Number(routeData.estimatedTime || 1));

          distanceText.textContent = t("distanceApprox", { value: Math.round(state.routeDistance) });
          timeText.textContent = t("timeApprox", { value: state.routeTime });
          nextStep.textContent =
            isFloor1ToFloor2
              ? t("transferFloor", { floor: uiFloorName(FLOOR2_ID) })
              : t("routeEntrance", { name: state.destination.name, algorithm: routeData.algorithm || "safe-route" });

          console.log(" route:", routeData);
        } catch (error) {
          console.error("路線取得失敗", error);
          state.route = [];
          nextStep.textContent = ` ${error.message}`;
        }

        renderAll();
      }

      function startNavigation() {
        if (!state.destination) {
          nextStep.textContent = t("chooseDestination");
          return;
        }
        state.navigationActive = true;

        state.pdrActive =
          state.current.floorId === FLOOR1_ID &&
          Array.isArray(state.route) &&
          state.route.some(
            (p) => Number.isFinite(Number(p.gridX)) && Number.isFinite(Number(p.gridY))
          );

        state.pdrHeadingOffsetDeg = null;
        state.pdrGridX = Number(state.current.gridX);
        state.pdrGridY = Number(state.current.gridY);
        state.pdrRawGridX = Number(state.current.gridX);
        state.pdrRawGridY = Number(state.current.gridY);
        state.pdrRouteIndex = findNearestPdrRouteIndex(
          state.pdrGridX,
          state.pdrGridY,
          0,
          Math.max(0, state.route.length - 1)
        );
        state.pdrStepCount = 0;
        state.pdrRxCount = 0;
        state.pdrAndroidCount = 0;
        state.pdrLastRxMs = 0;
        state.pdrLastOutcome = "READY";

        updatePdrSyncDebug("READY");
        nextStep.textContent = nextStepText();
        playNavigationAnimation("start");
        submitFeedback(false);
        renderAll();
      }

      function endNavigation() {
        state.navigationActive = false;
        state.pdrActive = false;
        state.pdrHeadingOffsetDeg = null;
        updatePdrDebug("PDR STOP");
        nextStep.textContent = t("navEnded");
        playNavigationAnimation("end");
        submitFeedback(true);
        setTimeout(() => {
          state.route = [];
          renderAll();
        }, 650);
        renderAll();
      }

      let trackingTimer = null;
      function startRealTimeTracking() {
        if (trackingTimer) clearInterval(trackingTimer);

        trackingTimer = setInterval(async () => {
          try {
            if (state.currentMapId === "map_visual_3") return;

            const response = await fetch(`${API_BASE}/api/current-location`);
            if (!response.ok) return;

            const positionData = await response.json();
            if (positionData?.status !== "success") return;

            const floor = currentFloor();
            if (!floor) return;

            const ox = Number(floor.imageLeft ?? -4.63);
            const oy = Number(floor.imageTop ?? -16.36);
            const imgW = Number(floor.imageWidth ?? 379.06);
            const imgH = Number(floor.imageHeight ?? 122.73);
            const scaleX = imgW / 75;
            const scaleY = imgH / 25;

            state.current.gridX = Number(positionData.x);
            state.current.gridY = Number(positionData.y);
            state.current.anchorId = positionData.anchorId || state.current.anchorId;

            const anchorDisplay = ANCHOR_DISPLAY_LOGICAL[state.current.anchorId];
            if (anchorDisplay) {
              state.current.x = getGridPixelX(anchorDisplay.x);
              state.current.y = getGridPixelY(anchorDisplay.y);
            } else {
              state.current.x = ox + (state.current.gridX + 0.5) * scaleX;
              state.current.y = oy + (state.current.gridY + 0.5) * scaleY;
            }

            state.current.floorId = "k-floor-grid";
            state.hasRealLocation = true;

            if (state.viewFollow) centerOnCurrent();
            drawMap();
          } catch (error) {
            console.error("無法取得最新位置", error);
          }
        }, 3000);
      }

drawPlaces();

      function drawWalkways() {
        if (!state.showGridOverlay) return;
        const floor = currentFloor();
        if (!floor?.imageUrl) return;
        const cols = 37, rows = 9;
        const cellW = floor.imageWidth / cols;
        const cellH = floor.imageHeight / rows;
        const ox = floor.imageLeft;
        const oy = floor.imageTop;
        ctx.save();
        applyFollowRotation();
        ctx.globalAlpha = 0.6;
        GRID_DATA.forEach((rowVals, r) => {
          rowVals.forEach((v, c) => {
            const x0 = ox + c * cellW;
            const y0 = oy + r * cellH;
            if (v === 1) {
              ctx.fillStyle = "#1f2933";
            } else if (v === 0 || v === 3) {
              ctx.fillStyle = "#ffffff";
            } else {
              return;
            }
            ctx.fillRect(x0, y0, cellW, cellH);
          });
        });
        ctx.restore();
      }
      function drawSecondFloorSchematic() {
        const floor = currentFloor();
        if (!floor?.schematic2F) return;

        const points = [
          FLOOR2_ANCHOR_PIXELS.ESCALATOR_END,
          FLOOR2_ANCHOR_PIXELS.MRT_P25,
          FLOOR2_ANCHOR_PIXELS.MRT_P50,
          FLOOR2_ANCHOR_PIXELS.MRT_P75,
          FLOOR2_ANCHOR_PIXELS.END_MRT,
        ].map((p) => baseScreen(p.x, p.y));

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        ctx.strokeStyle = "#e5e7eb";
        ctx.lineWidth = 42;
        ctx.beginPath();
        points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.stroke();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 26;

          floorId: point.floorId,
          category: "定位點",
          x: Number(point.x),
          y: Number(point.y),
          description: t("scanDesc", { scans: point.scanCount || 0, aps: point.bssidCount || 0 }),
          searchable: true,

          source: "wifiPoint",
        }));
        return state.places.concat(wifiTargets);
      }
      function setFeedbackAllowed(allowed) {
        state.feedbackAllowed = allowed;
        feedbackSwitch.checked = allowed;
        localStorage.setItem("feedbackConsentAsked", "true");
        localStorage.setItem("feedbackAllowed", String(allowed));

      function floorName(id) {
        const floor = state.floors.find((item) => item.id === id);
        return floor ? floor.floorName || floor.name || floor.id : id;
      }
      function shortFloorName(floor, index) {
        const name = floor.floorName || floor.name || floor.id;
        if (/ground|地面|一樓|1f/i.test(`${floor.id} ${name}`)) return "B1";
        if (/second|二樓|2f|2/i.test(`${floor.id} ${name}`)) return "R層";
        return name.length <= 3 ? name : `${index + 1}F`;
      }
      function isSecondFloor(id) {
        return /second|2|二樓/i.test(`${id} ${floorName(id)}`);
      }
      function distance(x1, y1, x2, y2) {
        return Math.hypot(x1 - x2, y1 - y2);
      }
      async function fetchJson(url) {
        const target = String(url).startsWith("/api/") ? `${API_BASE}${url}` : url;
        const response = await fetch(target);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      }
      async function postJson(url, body) {
        const target = String(url).startsWith("/api/") ? `${API_BASE}${url}` : url;
        const response = await fetch(target, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      }
      function anonymousId() {
        let id = localStorage.getItem("anonymousUserId");
        if (!id) {
          id = crypto.randomUUID
            ? crypto.randomUUID()
            : `web-${Date.now()}-${Math.random().toString(16).slice(2)}`;
          localStorage.setItem("anonymousUserId", id);
        }
        return id;
      }
      function escapeHtml(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[char],
        );
      }

      let currentReviewPlaceId = null;

      async function openReviewModal(placeId, placeName) {
        currentReviewPlaceId = placeId;
        document.getElementById("reviewPlaceName").textContent = t("reviewsTitle", { name: placeName });
        document.getElementById("reviewText").value = "";
        document.getElementById("reviewStar").value = "5";
        
        const reviewDialog = document.getElementById("reviewDialog");
        reviewDialog.showModal();

        await loadReviews(placeId);
      }

      async function loadReviews(placeId) {
        const container = document.getElementById("reviewsContainer");
        container.innerHTML = `<div style="text-align: center; color: var(--muted);">${escapeHtml(t("loadingReviews"))}</div>`;
        try {
          const response = await fetch(`${API_BASE}/api/reviews?placeId=${encodeURIComponent(placeId)}`);
          if (!response.ok) throw new Error("讀取失敗");
          const reviews = await response.json();
          
          if (reviews.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: var(--muted); padding: 20px 0;">${escapeHtml(t("noReviews"))}</div>`;
            return;
          }

          const avgStar = (reviews.reduce((acc, r) => acc + Number(r.star), 0) / reviews.length).toFixed(1);
          let html = `<div style="margin-bottom: 10px; font-weight: bold; color: var(--accent);">${escapeHtml(t("avgRating", { avg: avgStar, count: reviews.length }))}</div>`;
          
          reviews.reverse().forEach(r => {
            const stars = "⭐".repeat(r.star);
            const date = new Date(r.timestamp).toLocaleString(currentLang === "en" ? "en-US" : "zh-TW", { hour12: false });
            html += `
              <div style="border-bottom: 1px solid var(--line); padding: 10px 0;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                  <span>${stars}</span>
                  <span style="font-size: 12px; color: var(--muted);">${date}</span>
                </div>
                <div style="font-size: 14px; line-height: 1.4;">${escapeHtml(r.text)}</div>
              </div>
            `;
          });
          container.innerHTML = html;
        } catch (err) {
          container.innerHTML = `<div style="color: var(--danger); text-align: center;">${escapeHtml(t("reviewLoadFail"))}</div>`;
        }
      }

      async function submitReview() {
        const star = document.getElementById("reviewStar").value;
        const text = document.getElementById("reviewText").value.trim();
        
        if (!text) {
          alert(t("enterReview"));
          return;
        }

        try {
          const btn = document.querySelector("#reviewDialog .primary");
          btn.textContent = t("sending");
          btn.disabled = true;

          const response = await fetch(`${API_BASE}/api/reviews`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              placeId: currentReviewPlaceId,
              star: Number(star),
              text: text,
              timestamp: Date.now()
            })
          });

          if (!response.ok) throw new Error("儲存失敗");
          
          await loadReviews(currentReviewPlaceId);
          document.getElementById("reviewText").value = "";
        } catch (err) {
          alert(t("submitFail"));
        } finally {
          const btn = document.querySelector("#reviewDialog .primary");
          btn.textContent = t("submitReview");
          btn.disabled = false;
        }
      }
    </script>
    


    <script>

      function updatePdrDebug(message) {
        const el = document.getElementById("pdrDebug");
        if (!el) return;
        el.textContent = message;
        el.style.display = "block";
      }

      function updatePdrSyncDebug(outcome) {
        if (outcome) {
          state.pdrLastOutcome = outcome;
        }

        const el = document.getElementById("pdrSyncDebug");
        if (!el) return;

        el.textContent =
          `HYBRID ${Number(state.pdrAndroidCount || 0)} | ` +
          `RX ${Number(state.pdrRxCount || 0)} | ` +
          `MOVE ${Number(state.pdrStepCount || 0)} | ` +
          `${state.pdrLastOutcome || "WAIT"}`;

        el.style.display = "block";
      }

      function normalizeDeg(deg) {
        let value = Number(deg) % 360;
        if (value < 0) value += 360;
        return value;
      }

      function angularDiffDeg(a, b) {
        let d = normalizeDeg(a) - normalizeDeg(b);
        if (d > 180) d -= 360;
        if (d < -180) d += 360;
        return Math.abs(d);
      }

      function dqnGridToPixel(gx, gy) {
        const floor =
          state.floors.find((f) => f.id === FLOOR1_ID) || null;
        if (!floor) return null;

        const ox = Number(floor.imageLeft ?? -4.63);
        const oy = Number(floor.imageTop ?? -16.36);
        const imgW = Number(floor.imageWidth ?? 379.06);
        const imgH = Number(floor.imageHeight ?? 122.73);

        return {
          x: ox + (Number(gx) + 0.5) * (imgW / 75),
          y: oy + (Number(gy) + 0.5) * (imgH / 25),
        };
      }

      function routeHeadingDegAt(index) {
        if (!Array.isArray(state.route) || state.route.length < 2) return null;

        const start = Math.max(0, Math.min(index, state.route.length - 2));

        for (let i = start; i < Math.min(state.route.length - 1, start + 5); i++) {
          const a = state.route[i];
          const b = state.route[i + 1];

          if (
            !Number.isFinite(Number(a.gridX)) ||
            !Number.isFinite(Number(a.gridY)) ||
            !Number.isFinite(Number(b.gridX)) ||
            !Number.isFinite(Number(b.gridY))
          ) {
            continue;
          }

          const dx = Number(b.gridX) - Number(a.gridX);
          const dy = Number(b.gridY) - Number(a.gridY);
          if (Math.hypot(dx, dy) < 0.01) continue;

          return normalizeDeg(Math.atan2(dx, -dy) * 180 / Math.PI);
        }
        return null;
      }

      function findNearestPdrRouteIndex(gx, gy, fromIndex, toIndex) {
        if (!Array.isArray(state.route) || !state.route.length) return 0;

        const start = Math.max(0, Number.isFinite(fromIndex) ? fromIndex : 0);
        const end = Math.min(
          state.route.length - 1,
          Number.isFinite(toIndex) ? toIndex : state.route.length - 1
        );

        let bestIndex = start;
        let bestDistance = Infinity;

        for (let i = start; i <= end; i++) {
          const p = state.route[i];
          if (
            !Number.isFinite(Number(p.gridX)) ||
            !Number.isFinite(Number(p.gridY))
          ) {
            continue;
          }

          const d = Math.hypot(
            Number(p.gridX) - Number(gx),
            Number(p.gridY) - Number(gy)
          );

          if (d < bestDistance) {
            bestDistance = d;
            bestIndex = i;
          }
        }

        return bestIndex;
      }

      function resetPdrFromCurrent() {
        state.pdrGridX = Number(state.current.gridX);
        state.pdrGridY = Number(state.current.gridY);
        state.pdrRawGridX = Number(state.current.gridX);
        state.pdrRawGridY = Number(state.current.gridY);
        state.pdrHeadingOffsetDeg = null;
        state.pdrRouteIndex = findNearestPdrRouteIndex(
          state.pdrGridX,
          state.pdrGridY,
          0,
          Math.max(0, state.route.length - 1)
        );
      }

      function calibratePdrHeading(sensorHeadingDeg) {
        const raw = Number(sensorHeadingDeg);

        if (
          !Number.isFinite(raw) ||
          !Array.isArray(state.route) ||
          state.route.length < 2
        ) {
          return false;
        }

        state.pdrSensorHeading = normalizeDeg(raw);

        if (
          Number.isFinite(Number(state.current.gridX)) &&
          Number.isFinite(Number(state.current.gridY))
        ) {
          state.pdrRouteIndex = findNearestPdrRouteIndex(
            Number(state.current.gridX),
            Number(state.current.gridY),
            0,
            Math.max(0, state.route.length - 1)
          );
        }

        const routeHeading =
          routeHeadingDegAt(state.pdrRouteIndex);

        if (!Number.isFinite(routeHeading)) {
          return false;
        }

        state.pdrHeadingOffsetDeg =
          normalizeDeg(routeHeading - state.pdrSensorHeading);

        state.heading =
          normalizeDeg(routeHeading);

        updatePdrDebug(
          `HEADING CAL｜sensor=${Math.round(state.pdrSensorHeading)}°｜` +
          `route=${Math.round(routeHeading)}°`
        );

        return true;
      }

      window.calibratePdrHeading = calibratePdrHeading;

      function submitPdrHeading(sensorHeadingDeg) {
        const raw = Number(sensorHeadingDeg);
        if (!Number.isFinite(raw)) return;

        state.pdrSensorHeading = normalizeDeg(raw);

        if (state.pdrHeadingOffsetDeg != null) {
          state.heading = normalizeDeg(
            state.pdrSensorHeading + state.pdrHeadingOffsetDeg
          );
        }
      }

      function submitPdrStep(sensorHeadingDeg, androidStepCount) {
        const nowMs = Date.now();
        state.pdrRxCount = Number(state.pdrRxCount || 0) + 1;
        const gapMs =
          state.pdrLastRxMs > 0
            ? nowMs - state.pdrLastRxMs
            : 0;
        state.pdrLastRxMs = nowMs;

        const androidCount = Number(androidStepCount);
        if (Number.isFinite(androidCount)) {
          state.pdrAndroidCount = androidCount;
        } else {
          state.pdrAndroidCount = state.pdrRxCount;
        }

        updatePdrSyncDebug("RX");

        const raw = Number(sensorHeadingDeg);
        if (Number.isFinite(raw)) {
          state.pdrSensorHeading = normalizeDeg(raw);
        }

        if (!state.hasRealLocation) {
          updatePdrDebug(
            `RX ${state.pdrRxCount}｜gap=${gapMs}ms｜` +
            `PDR BLOCK：尚未取得 REAL Wi-Fi 起點`
          );
          updatePdrSyncDebug("BLOCK NO-WIFI");
          return;
        }

        if (
          state.current.floorId !== FLOOR1_ID ||
          state.currentFloorId !== FLOOR1_ID
        ) {
          updatePdrDebug("PDR WAIT：目前 v16 先驗證 B1");
          updatePdrSyncDebug("BLOCK FLOOR");
          return;
        }

        if (!state.navigationActive || !state.pdrActive) {
          updatePdrDebug("PDR WAIT：請先選目的地並按「開始導航」");
          updatePdrSyncDebug("BLOCK NAV");
          return;
        }

        if (
          !Array.isArray(state.route) ||
          !state.route.some(
            (p) => Number.isFinite(Number(p.gridX)) && Number.isFinite(Number(p.gridY))
          )
        ) {
          updatePdrDebug("PDR BLOCK：目前沒有可 map-match 的 DQN 路線");
          updatePdrSyncDebug("BLOCK ROUTE");
          return;
        }

        if (
          !Number.isFinite(Number(state.pdrGridX)) ||
          !Number.isFinite(Number(state.pdrGridY))
        ) {
          resetPdrFromCurrent();
        }

        const sensorHeading = Number(state.pdrSensorHeading);
        if (!Number.isFinite(sensorHeading)) {
          updatePdrDebug("PDR WAIT：尚未收到 Rotation Vector 方向");
          updatePdrSyncDebug("BLOCK HEADING");
          return;
        }

        if (state.pdrHeadingOffsetDeg == null) {
          const routeHeading = routeHeadingDegAt(state.pdrRouteIndex);
          if (!Number.isFinite(routeHeading)) {
            updatePdrDebug("PDR BLOCK：無法取得路線方向");
            updatePdrSyncDebug("BLOCK ROUTE-HEAD");
            return;
          }

          state.pdrHeadingOffsetDeg =
            normalizeDeg(routeHeading - sensorHeading);

          state.heading = routeHeading;
        } else {
          state.heading = normalizeDeg(
            sensorHeading + state.pdrHeadingOffsetDeg
          );
        }

        const mappedHeading = Number(state.heading);
        const expectedHeading = routeHeadingDegAt(state.pdrRouteIndex);

        const stepCells =
          Number(state.pdrStepLengthM) / Number(state.pdrGridCellM);

        if (
          !Number.isFinite(Number(state.pdrRawGridX)) ||
          !Number.isFinite(Number(state.pdrRawGridY))
        ) {
          state.pdrRawGridX = Number(state.pdrGridX);
          state.pdrRawGridY = Number(state.pdrGridY);
        }

        const rad = mappedHeading * Math.PI / 180;

        const candidateX =
          Number(state.pdrRawGridX) + Math.sin(rad) * stepCells;
        const candidateY =
          Number(state.pdrRawGridY) - Math.cos(rad) * stepCells;

        state.pdrRawGridX = candidateX;
        state.pdrRawGridY = candidateY;

        const searchFrom = Math.max(0, state.pdrRouteIndex - 8);
        const searchTo = Math.min(
          state.route.length - 1,
          state.pdrRouteIndex + 8
        );

        const nearestIndex = findNearestPdrRouteIndex(
          candidateX,
          candidateY,
          searchFrom,
          searchTo
        );

        const nearest = state.route[nearestIndex];

        let routeDistance = Infinity;
        if (
          nearest &&
          Number.isFinite(Number(nearest.gridX)) &&
          Number.isFinite(Number(nearest.gridY))
        ) {
          routeDistance = Math.hypot(
            Number(nearest.gridX) - candidateX,
            Number(nearest.gridY) - candidateY
          );
        }

        if (routeDistance <= 3.0) {
          const snapWeight = 0.90;

          state.pdrGridX =
            candidateX * (1 - snapWeight) +
            Number(nearest.gridX) * snapWeight;

          state.pdrGridY =
            candidateY * (1 - snapWeight) +
            Number(nearest.gridY) * snapWeight;

          state.pdrRouteIndex = nearestIndex;
        } else {
          state.pdrGridX = candidateX;
          state.pdrGridY = candidateY;

          if (routeDistance <= 3.0) {
            state.pdrRouteIndex = nearestIndex;
          }
        }

        state.current.gridX = state.pdrGridX;
        state.current.gridY = state.pdrGridY;
        state.current.anchorId = null;

        const display = dqnGridToPixel(
          state.current.gridX,
          state.current.gridY
        );
        if (!display) {
          updatePdrDebug("PDR BLOCK：無法轉換地圖座標");
          updatePdrSyncDebug("BLOCK PIXEL");
          return;
        }

        state.current.x = display.x;
        state.current.y = display.y;
        state.current.floorId = FLOOR1_ID;
        state.currentFloorId = FLOOR1_ID;

        state.pdrStepCount += 1;
        updatePdrSyncDebug("MOVE");

        const routeState =
          routeDistance <= 1.15
            ? "ON ROUTE"
            : "OFF ROUTE";

        const turnDiff =
          Number.isFinite(expectedHeading)
            ? Math.round(angularDiffDeg(mappedHeading, expectedHeading))
            : 0;

        updatePdrDebug(
          `RX ${state.pdrRxCount}｜PDR STEP ${state.pdrStepCount}｜${routeState}｜` +
          `gap=${gapMs}ms｜map=${Math.round(mappedHeading)}° Δ=${turnDiff}°｜` +
          `grid=(${state.current.gridX.toFixed(1)},${state.current.gridY.toFixed(1)})`
        );

        if (state.viewFollow && state.pdrStepCount % 4 === 0) {
          centerOnCurrent();
        }

        drawMap();
      }

      window.submitPdrHeading = submitPdrHeading;
      window.submitPdrStep = submitPdrStep;
    </script>

    <script>
      function showRealDebug(data, p, matchedAp) {
        return;
      }

      async function submitRealWifiScan(signals) {
        if (!Array.isArray(signals) || signals.length === 0) {
          console.warn("REAL Wi-Fi 掃描為空");
          return;
        }

        try {
          const response = await fetch(`${API_BASE}/api/locate-real`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ signals }),
          });

          if (!response.ok) {
            const err = await response.json().catch(() => ({}));
            throw new Error(err.detail || `HTTP ${response.status}`);
          }

          const data = await response.json();
          const matchedAp = Number(data.matchedFeatureCount || 0);

          if (data.validLocation === false || matchedAp < 5) {
            state.hasRealLocation = false;
            console.warn(" REAL 定位無效", data);
            nextStep.textContent =
              t("invalidLocation", { count: matchedAp });
            renderAll();
            return;
          }

          const realFloor = Number(data.floor);
          state.current.anchorId = data.anchorId || null;

          if (realFloor === 1) {
            const p = floor2PixelFromReal(data);
            if (!p) {
              console.warn("2F REAL 定位成功，但缺少顯示座標", data);
              return;
            }

            state.current.gridX = Number(data.gridX);
            state.current.gridY = Number(data.gridY);
            state.current.x = p.x;
            state.current.y = p.y;
            state.current.floorId = FLOOR2_ID;
            state.currentFloorId = FLOOR2_ID;
            state.lastRealFix = {
              floor: 1,
              anchorId: data.anchorId || null,
              x: Number(p.x),
              y: Number(p.y),
              matchedAp,
            };
            state.hasRealLocation = true;
            state.viewFocusedKey = null;

            drawMap();
            showRealDebug(data, p, matchedAp);

            updateWorldFromData();
            renderFloorButtons();
            performSearch();

            if (state.destination) {
              await showRoute();
            }

            console.log(
              ` REAL 2F 藍點 anchor=${state.current.anchorId} ` +
              `logical=(${state.current.gridX},${state.current.gridY}) ` +
              `matchedAP=${matchedAp}`
            );

            if (state.destination && state.destination.floorId !== FLOOR2_ID) {
              nextStep.textContent =
                t("transferFloor", { floor: uiFloorName(state.destination.floorId) });
            }

            if (state.viewFollow) centerOnCurrent();
            renderAll();
            return;
          }

          if (realFloor !== 0) {
            console.warn("未知 REAL 樓層", data);
            return;
          }

          if (!Number.isFinite(Number(data.dqnX)) ||
              !Number.isFinite(Number(data.dqnY))) {
            console.warn("1F 定位缺少已驗證 DQN grid", data);
            nextStep.textContent = t("outsideDqn");
            return;
          }

          state.currentFloorId = FLOOR1_ID;
          const floor = currentFloor();
          if (!floor) return;

          const ox = Number(floor.imageLeft ?? -4.63);
          const oy = Number(floor.imageTop ?? -16.36);
          const imgW = Number(floor.imageWidth ?? 379.06);
          const imgH = Number(floor.imageHeight ?? 122.73);

          state.current.gridX = Number(data.dqnX);
          state.current.gridY = Number(data.dqnY);

          const anchorDisplay = ANCHOR_DISPLAY_LOGICAL[state.current.anchorId];
          if (anchorDisplay) {
            state.current.x = getGridPixelX(anchorDisplay.x);
            state.current.y = getGridPixelY(anchorDisplay.y);
          } else {
            state.current.x =
              ox + (state.current.gridX + 0.5) * (imgW / 75);
            state.current.y =
              oy + (state.current.gridY + 0.5) * (imgH / 25);
          }

          state.current.floorId = FLOOR1_ID;
          state.lastRealFix = {
            floor: 0,
            anchorId: data.anchorId || null,
            x: Number(state.current.x),
            y: Number(state.current.y),
            matchedAp,
          };
          state.hasRealLocation = true;

          const wifiGridX = Number(state.current.gridX);
          const wifiGridY = Number(state.current.gridY);

          const hasRunningPdr =
            state.navigationActive &&
            state.pdrActive &&
            Number.isFinite(Number(state.pdrRawGridX)) &&
            Number.isFinite(Number(state.pdrRawGridY));

          if (hasRunningPdr) {
            const pdrX = Number(state.pdrRawGridX);
            const pdrY = Number(state.pdrRawGridY);
            const driftCells = Math.hypot(
              wifiGridX - pdrX,
              wifiGridY - pdrY
            );

            const correctionWeight = 0;

            const correctedX =
              pdrX * (1 - correctionWeight) +
              wifiGridX * correctionWeight;

            const correctedY =
              pdrY * (1 - correctionWeight) +
              wifiGridY * correctionWeight;

            state.pdrRawGridX = correctedX;
            state.pdrRawGridY = correctedY;
            state.pdrGridX = correctedX;
            state.pdrGridY = correctedY;

            state.current.gridX = correctedX;
            state.current.gridY = correctedY;
            state.current.anchorId = null;

            const correctedDisplay =
              dqnGridToPixel(correctedX, correctedY);

            if (correctedDisplay) {
              state.current.x = correctedDisplay.x;
              state.current.y = correctedDisplay.y;
            }

            if (state.route.length) {
              state.pdrRouteIndex = findNearestPdrRouteIndex(
                correctedX,
                correctedY,
                Math.max(0, state.pdrRouteIndex - 12),
                Math.min(
                  state.route.length - 1,
                  state.pdrRouteIndex + 12
                )
              );
            }

            updatePdrDebug(
              `RX ${state.pdrRxCount}｜Wi-Fi SOFT CORRECT ` +
              `${Math.round(correctionWeight * 100)}%｜` +
              `drift=${driftCells.toFixed(1)}格`
            );
          } else {
            state.pdrGridX = wifiGridX;
            state.pdrGridY = wifiGridY;
            state.pdrRawGridX = wifiGridX;
            state.pdrRawGridY = wifiGridY;
            state.pdrHeadingOffsetDeg = null;

            if (state.navigationActive && state.route.length) {
              state.pdrRouteIndex = findNearestPdrRouteIndex(
                state.pdrGridX,
                state.pdrGridY,
                0,
                Math.max(0, state.route.length - 1)
              );
            }
          }

          updateWorldFromData();
          renderFloorButtons();
          performSearch();

          showRealDebug(
            data,
            { x: Number(state.current.x), y: Number(state.current.y) },
            matchedAp
          );

          console.log(
            ` REAL 1F 藍點 anchor=${state.current.anchorId} ` +
            `DQN=(${state.current.gridX},${state.current.gridY}) ` +
            `matchedAP=${matchedAp}`
          );

          if (state.navigationActive && state.destination &&
              state.destination.floorId === FLOOR1_ID) {

            const hasDqnRoute =
              Array.isArray(state.route) &&
              state.route.some(
                (p) =>
                  Number.isFinite(Number(p.gridX)) &&
                  Number.isFinite(Number(p.gridY))
              );

          if (!state.pdrActive || !hasDqnRoute) {
              await showRoute();

              const hasNewDqnRoute =
                Array.isArray(state.route) &&
                state.route.some(
                  (p) =>
                    Number.isFinite(Number(p.gridX)) &&
                    Number.isFinite(Number(p.gridY))
                );

              if (
                state.navigationActive &&
                state.current.floorId === FLOOR1_ID &&
                state.destination?.floorId === FLOOR1_ID &&
                !state.pdrActive &&
                hasNewDqnRoute
              ) {
                state.pdrActive = true;
                resetPdrFromCurrent();

                state.pdrStepCount = 0;
                state.pdrRxCount = 0;
                state.pdrAndroidCount = 0;
                state.pdrLastRxMs = 0;
                state.pdrLastOutcome = "READY";

                updatePdrSyncDebug("READY");
              }
            }
          }
          if (state.viewFollow && !state.pdrActive) {
            centerOnCurrent();
          }

          renderAll();
        } catch (error) {
          console.error("定位運算發生錯誤:", error);
        }
      }

      window.submitRealWifiScan = submitRealWifiScan;

      window.receiveAndroidWifiSignals = async function (signalsJsonString) {
        try {
          const parsed = typeof signalsJsonString === "string"
            ? JSON.parse(signalsJsonString)
            : signalsJsonString;
          await submitRealWifiScan(parsed);
        } catch (error) {
          console.error("Android Wi-Fi JSON 解析失敗", error);
        }
      };
    </script>
  


    <button id="sosButton" type="button" aria-label="長按一秒啟動 SOS">
      SOS
      <small>長按 1 秒</small>
    </button>

    <div id="sosOverlay" role="alertdialog" aria-modal="true" aria-live="assertive">
      <div class="sos-symbol"></div>
      <h2>SOS 緊急警報</h2>
      <p>警報已啟動，請前往安全、人多或有工作人員的區域。</p>
      <button id="sosStopButton" type="button">停止警報</button>
    </div>

    <script>
      (() => {
        const HOLD_MS = 1000;

        const button = document.getElementById("sosButton");
        const overlay = document.getElementById("sosOverlay");
        const stopButton = document.getElementById("sosStopButton");

        if (!button || !overlay || !stopButton) return;

        let active = false;
        let holdTimer = null;
        let holdStartedAt = 0;

        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;
        let sirenTimer = null;

        function callNativeStart() {
          try {
            if (
              window.AndroidSOS &&
              typeof window.AndroidSOS.startSosMode === "function"
            ) {
              window.AndroidSOS.startSosMode();
            }
          } catch (error) {
            console.warn("AndroidSOS.startSosMode failed", error);
          }
        }

        function callNativeStop() {
          try {
            if (
              window.AndroidSOS &&
              typeof window.AndroidSOS.stopSosMode === "function"
            ) {
              window.AndroidSOS.stopSosMode();
            }
          } catch (error) {
            console.warn("AndroidSOS.stopSosMode failed", error);
          }
        }

        async function startSiren() {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;

          if (!AudioCtx) {
            throw new Error("AudioContext not supported");
          }

          audioCtx = audioCtx || new AudioCtx();

          if (audioCtx.state === "suspended") {
            await audioCtx.resume();
          }

          oscillator = audioCtx.createOscillator();
          gainNode = audioCtx.createGain();

          oscillator.type = "square";
          oscillator.frequency.setValueAtTime(720, audioCtx.currentTime);
          gainNode.gain.setValueAtTime(0.62, audioCtx.currentTime);

          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          oscillator.start();

          let high = false;

          sirenTimer = setInterval(() => {
            if (!oscillator || !audioCtx) return;

            high = !high;

            oscillator.frequency.setValueAtTime(
              high ? 1320 : 720,
              audioCtx.currentTime
            );
          }, 290);
        }

        function stopSiren() {
          if (sirenTimer) {
            clearInterval(sirenTimer);
            sirenTimer = null;
          }

          if (oscillator) {
            try { oscillator.stop(); } catch (_) {}
            try { oscillator.disconnect(); } catch (_) {}
          }

          if (gainNode) {
            try { gainNode.disconnect(); } catch (_) {}
          }

          oscillator = null;
          gainNode = null;
        }

        async function activateSos() {
          if (active) return;

          active = true;
          clearHold();

          button.hidden = true;
          overlay.classList.add("sos-active");
          document.body.style.overflow = "hidden";

          callNativeStart();

          try {
            await startSiren();
          } catch (error) {
            console.error("SOS siren failed", error);
            alert("SOS 已啟動，但警報聲播放失敗。請確認裝置音效設定。");
          }
        }

        function stopSos() {
          if (!active) return;

          active = false;

          stopSiren();
          callNativeStop();

          overlay.classList.remove("sos-active");
          button.hidden = false;
          document.body.style.overflow = "";
        }

        function beginHold(event) {
          if (active) return;

          event.preventDefault();
          clearHold();

          holdStartedAt = Date.now();
          button.classList.add("sos-holding");
          button.querySelector("small").textContent = "持續按住…";

          holdTimer = setTimeout(() => {
            activateSos();
          }, HOLD_MS);
        }

        function clearHold() {
          if (holdTimer) {
            clearTimeout(holdTimer);
            holdTimer = null;
          }

          button.classList.remove("sos-holding");

          const hint = button.querySelector("small");
          if (hint) hint.textContent = "長按 1 秒";
        }

        function cancelHold(event) {
          if (active) return;
          if (event) event.preventDefault();

          const heldMs = Date.now() - holdStartedAt;
          if (heldMs < HOLD_MS) {
            clearHold();
          }
        }

        button.addEventListener("pointerdown", beginHold);
        button.addEventListener("pointerup", cancelHold);
        button.addEventListener("pointercancel", cancelHold);
        button.addEventListener("pointerleave", cancelHold);
        button.addEventListener("contextmenu", (event) => event.preventDefault());

        stopButton.addEventListener("click", stopSos);

        window.addEventListener("pagehide", () => {
          clearHold();
          if (active) stopSos();
        });
      })();
    </script>


  </body>
